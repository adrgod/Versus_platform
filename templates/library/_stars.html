<span class="stars" role="group" aria-label="Rating" data-rate-kind="{{ kind }}" data-rate-id="{{ object_id }}" data-rate-value="{{ value|default:0 }}">{% for n in "12345" %}<button type="button" class="star{% if forloop.counter <= value %} is-on{% endif %}" data-star="{{ forloop.counter }}" aria-label="{{ forloop.counter }} star{{ forloop.counter|pluralize }}" title="{{ forloop.counter }} star{{ forloop.counter|pluralize }}">★</button>{% endfor %}</span>
