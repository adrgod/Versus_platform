{% comment %}Rating stars. Pass kind ("track" = 1-5, "album" = 1-10), object_id, value; album stars have a cross before them that removes the rating.{% endcomment %}
<span class="stars" role="group" aria-label="Rating" data-rate-kind="{{ kind }}" data-rate-id="{{ object_id }}" data-rate-value="{{ value|default:0 }}">{% if kind == "album" %}<button type="button" class="rate-clear" data-rate-clear aria-label="Remove rating" title="Remove rating">✕</button>{% for n in "1234567890" %}<button type="button" class="star{% if forloop.counter <= value %} is-on{% endif %}" data-star="{{ forloop.counter }}" aria-label="{{ forloop.counter }} out of 10" title="{{ forloop.counter }}/10">★</button>{% endfor %}{% else %}{% for n in "12345" %}<button type="button" class="star{% if forloop.counter <= value %} is-on{% endif %}" data-star="{{ forloop.counter }}" aria-label="{{ forloop.counter }} star{{ forloop.counter|pluralize }}" title="{{ forloop.counter }} star{{ forloop.counter|pluralize }}">★</button>{% endfor %}{% endif %}</span>
